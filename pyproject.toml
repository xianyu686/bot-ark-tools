[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-core"
version = "1.1.0"
description = "Pure & framework-independent Arknights data toolkit: gacha/archive/voice/story/recruit, with CLI + HTTP microservice"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["arknights", "明日方舟", "gacha", "framework-independent", "pure"]
dependencies = ["requests>=2.28"]

[project.scripts]
ark-tools = "ak_tools.cli:main"

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]  # 可选：用 FastAPI 跑服务（默认用标准库 http.server，零依赖）

[tool.setuptools.packages.find]
include = ["ak_core*", "akdata_crawler*", "ak_tools*"]
