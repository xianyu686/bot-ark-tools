[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arknights-datakit"
version = "1.4.0"
description = "Pure & framework-independent Arknights data toolkit: gacha/archive/voice/story/recruit, with CLI + HTTP microservice"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "xianyu686" }]
keywords = ["arknights", "明日方舟", "gacha", "framework-independent", "pure", "astrbot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/xianyu686/bot-ark-tools"
Repository = "https://github.com/xianyu686/bot-ark-tools"
Issues = "https://github.com/xianyu686/bot-ark-tools/issues"

[project.scripts]
ark-tools = "ak_tools.cli:main"

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]  # 可选：用 FastAPI 跑服务（默认用标准库 http.server，零依赖）

[tool.setuptools.packages.find]
include = ["ak_core*", "akdata_crawler*", "ak_tools*"]
